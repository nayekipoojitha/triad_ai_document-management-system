version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: triad_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - triad_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: triad_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - MONGO_DB=triad_dms
      - JWT_SECRET=triad-ai-dms-super-secret-key-2026
      - PORT=5000
      - HOST=0.0.0.0
    depends_on:
      - mongodb
    networks:
      - triad_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: triad_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - triad_net

volumes:
  mongo_data:

networks:
  triad_net:
    driver: bridge
